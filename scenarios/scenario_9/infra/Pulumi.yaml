name: infra
runtime:
  name: python
description: A GCP Python Pulumi program for Scenario 9 - GCP Cloud Detection and Response
config:
  # Your GCP project ID
  gcp:project: "test-sandbox-env"

  # Path to the public key that will be generated by the scenario runner
  infra:publicKeyPath: ../../../scenario_9_id_rsa.pub

  # Ubuntu image for the compute instance
  # To find available images: gcloud compute images list --project ubuntu-os-cloud --filter="name~ubuntu-2404"
  # Make sure the image's kernel version is supported by the agent; otherwise the agent installation may fail.
  # https://docs-cortex.paloaltonetworks.com/r/Cortex-XDR/Linux-Kernel-Versions/Ubuntu-24-x86_64
  infra:ubuntuImage: projects/ubuntu-os-cloud/global/images/ubuntu-2404-noble-amd64-v20251205

  # Whether to include the Cortex XDR agent on the compute instance
  infra:includeAgent: true
  infra:agentInstallerPath: ../../../cobra-9-agent-gce_sh.tar.gz  # Needs to be tar.gz of x86_64 SH Linux Installer

  # Custom labels applied to all GCP resources that support labeling
  infra:labels:
    value:
      project: "cobra"

  pulumi:tags:
    value:
      pulumi:template: ""
